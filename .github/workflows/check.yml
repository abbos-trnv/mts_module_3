name: Hive integration
on: [push, pull_request, workflow_dispatch]
jobs:
  hive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lab.py up
      - run: python3 scripts/lab.py verify
      - if: always()
        run: docker compose logs --no-color > hive.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-logs
          path: hive.log
      - if: always()
        run: python3 scripts/lab.py down
