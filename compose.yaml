name: mts-yarn
x-hadoop: &hadoop
  build: .
  image: mts-hadoop:3.4.1
  init: true
  restart: unless-stopped
  networks: [hadoop]
services:
  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: [resourcemanager]
    ports: ["${BIND_IP:-127.0.0.1}:8088:8088"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8088/ws/v1/cluster/info"]
      interval: 10s
      timeout: 5s
      retries: 30
  nodemanager1:
    <<: *hadoop
    hostname: nodemanager1
    command: [nodemanager]
    environment: {NM_WEB_PORT: "8042"}
    ports: ["${BIND_IP:-127.0.0.1}:8042:8042"]
    depends_on:
      resourcemanager: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8042/ws/v1/node/info"]
      interval: 10s
      timeout: 5s
      retries: 30
  nodemanager2:
    <<: *hadoop
    hostname: nodemanager2
    command: [nodemanager]
    environment: {NM_WEB_PORT: "8043"}
    ports: ["${BIND_IP:-127.0.0.1}:8043:8043"]
    depends_on:
      resourcemanager: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8043/ws/v1/node/info"]
      interval: 10s
      timeout: 5s
      retries: 30
  nodemanager3:
    <<: *hadoop
    hostname: nodemanager3
    command: [nodemanager]
    environment: {NM_WEB_PORT: "8044"}
    ports: ["${BIND_IP:-127.0.0.1}:8044:8044"]
    depends_on:
      resourcemanager: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8044/ws/v1/node/info"]
      interval: 10s
      timeout: 5s
      retries: 30
  historyserver:
    <<: *hadoop
    hostname: historyserver
    command: [historyserver]
    ports: ["${BIND_IP:-127.0.0.1}:19888:19888"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:19888/ws/v1/history/info"]
      interval: 10s
      timeout: 5s
      retries: 30
networks:
  hadoop:
    external: true
    name: mts-hadoop
