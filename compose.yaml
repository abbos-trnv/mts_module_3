name: hive-homework3
x-hive: &hive
  build: .
  image: hive-homework3:4.0.0-alpha-2
  volumes:
    - warehouse:/warehouse
    - ./data:/input:ro
    - ./sql:/sql:ro
services:
  postgres:
    image: postgres:14.15
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_lab_only
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 30
  schema:
    <<: *hive
    command: [schema]
    depends_on:
      postgres:
        condition: service_healthy
  metastore:
    <<: *hive
    command: [metastore]
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, bash, -c, "echo > /dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  hiveserver2:
    <<: *hive
    command: [hiveserver2]
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10002:10002"
    depends_on:
      metastore:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "beeline -u jdbc:hive2://localhost:10000/default -n hive --silent=true -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 30
      start_period: 60s
volumes:
  postgres:
  warehouse:
