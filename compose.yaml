name: mts-spark
x-hive: &hive
  build: ./hive
  image: mts-hive-hdfs:4.0.0-alpha-2
  init: true
  networks: [hadoop]
  environment:
    METASTORE_PASSWORD: "${METASTORE_PASSWORD:?Run python lab.py up first}"
services:
  spark:
    build: .
    image: mts-spark:3.5.7
    hostname: spark-client
    profiles: [tools]
    networks: [hadoop]
    command: [spark-submit, --version]
  spark-postgres:
    image: postgres:14.15
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: "${METASTORE_PASSWORD:?Run python lab.py up first}"
    networks: [hadoop]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 30
  schema:
    <<: *hive
    command: [schema]
    depends_on:
      spark-postgres: {condition: service_healthy}
  spark-metastore:
    <<: *hive
    command: [metastore]
    depends_on:
      schema: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, bash, -c, "echo > /dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  spark-hiveserver2:
    <<: *hive
    command: [hiveserver2]
    ports: ["127.0.0.1:10010:10000", "127.0.0.1:10012:10002"]
    depends_on:
      spark-metastore: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "beeline -u jdbc:hive2://localhost:10000/default -n root --silent=true -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 30
      start_period: 60s
volumes:
  postgres:
networks:
  hadoop:
    external: true
    name: mts-hadoop
