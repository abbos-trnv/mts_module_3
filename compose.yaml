name: mts-hdfs
x-hadoop: &hadoop
  build: .
  image: mts-hadoop:3.4.1
  init: true
  networks: [hadoop]
  restart: unless-stopped
services:
  namenode:
    <<: *hadoop
    hostname: namenode
    command: [namenode]
    volumes: ["name:/data/name"]
    ports: ["${BIND_IP:-127.0.0.1}:9870:9870"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9870/jmx"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  secondary:
    <<: *hadoop
    hostname: secondary
    command: [secondary]
    volumes: ["secondary:/data/secondary"]
    ports: ["${BIND_IP:-127.0.0.1}:9868:9868"]
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9868/jmx"]
      interval: 10s
      timeout: 5s
      retries: 30
  datanode1:
    <<: *hadoop
    hostname: datanode1
    command: [datanode]
    environment: {WEB_PORT: "9864"}
    volumes: ["data1:/data/datanode"]
    ports: ["${BIND_IP:-127.0.0.1}:9864:9864"]
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9864/jmx"]
      interval: 10s
      timeout: 5s
      retries: 30
  datanode2:
    <<: *hadoop
    hostname: datanode2
    command: [datanode]
    environment: {WEB_PORT: "9865"}
    volumes: ["data2:/data/datanode"]
    ports: ["${BIND_IP:-127.0.0.1}:9865:9865"]
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9865/jmx"]
      interval: 10s
      timeout: 5s
      retries: 30
  datanode3:
    <<: *hadoop
    hostname: datanode3
    command: [datanode]
    environment: {WEB_PORT: "9866"}
    volumes: ["data3:/data/datanode"]
    ports: ["${BIND_IP:-127.0.0.1}:9866:9866"]
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9866/jmx"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  name:
  secondary:
  data1:
  data2:
  data3:
networks:
  hadoop:
    name: mts-hadoop
